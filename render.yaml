databases:
  - name: qzmotorcenter-scooter-db
    databaseName: qzmotorcenterscooter
    user: qzmotorcenter
    plan: free

services:
  - type: web
    name: qzmotorcenter-scooter-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/scooters
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: qzmotorcenter-scooter-db
          property: connectionString
